<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — EBD Recanto Elimar</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; }
body { background: #0D1B2A; font-family: 'EB Garamond', Georgia, serif; color: #E8DFC8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }

.card {
  background: #111F30;
  border: 1px solid #C9A84C44;
  border-radius: 16px;
  padding: 2.5rem 2.5rem 2rem;
  width: 100%;
  max-width: 480px;
  text-align: center;
}

.cross { font-size: 1rem; color: #C9A84C; letter-spacing: 0.4em; margin-bottom: 0.5rem; font-family: 'Cinzel', serif; }
h1 { font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 700; color: #C9A84C; letter-spacing: 0.06em; margin-bottom: 0.3rem; }
.sub { font-size: 0.82rem; color: #8A7E6A; font-style: italic; margin-bottom: 2rem; }

.field { margin-bottom: 1.2rem; text-align: left; }
label { display: block; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.14em; color: #8A7E6A; text-transform: uppercase; margin-bottom: 0.4rem; }

input[type="password"],
input[type="file"] {
  width: 100%;
  background: #0D1B2A;
  border: 1px solid #C9A84C33;
  border-radius: 8px;
  color: #E8DFC8;
  font-family: 'EB Garamond', serif;
  font-size: 0.9rem;
  padding: 0.7rem 1rem;
  outline: none;
  transition: border-color 0.2s;
}
input[type="password"]:focus,
input[type="file"]:focus { border-color: #C9A84C88; }

input[type="file"] { cursor: pointer; padding: 0.55rem 0.8rem; }
input[type="file"]::file-selector-button {
  background: #1A2E44;
  border: 1px solid #C9A84C44;
  border-radius: 6px;
  color: #C9A84C;
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  padding: 0.3rem 0.8rem;
  cursor: pointer;
  margin-right: 0.8rem;
}

.btn {
  width: 100%;
  background: #C9A84C;
  border: none;
  border-radius: 8px;
  color: #0D1B2A;
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  padding: 0.85rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  margin-top: 0.5rem;
}
.btn:hover { background: #E8C870; }
.btn:active { transform: scale(0.98); }
.btn:disabled { background: #4A3A1A; color: #8A7E6A; cursor: not-allowed; transform: none; }

.msg {
  margin-top: 1.2rem;
  font-size: 0.85rem;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  display: none;
  text-align: left;
}
.msg.ok { background: #0D2A1A; border: 1px solid #2A7A4A; color: #7ADBA0; display: block; }
.msg.err { background: #2A0D0D; border: 1px solid #7A2A2A; color: #DBA0A0; display: block; }
.msg.loading { background: #0D1F30; border: 1px solid #C9A84C44; color: #C9A84C; display: block; }

.back-link {
  margin-top: 1.5rem;
  font-size: 0.78rem;
  color: #8A7E6A;
  text-decoration: none;
  font-family: 'Cinzel', serif;
  letter-spacing: 0.1em;
  transition: color 0.2s;
}
.back-link:hover { color: #C9A84C; }

.file-info {
  font-size: 0.72rem;
  color: #6A6058;
  font-style: italic;
  margin-top: 0.4rem;
}

.divider { border: none; border-top: 1px solid #C9A84C22; margin: 1.5rem 0; }
</style>
</head>
<body>

<div class="card">
  <div class="cross">✦ ✝ ✦</div>
  <h1>Painel Administrativo</h1>
  <div class="sub">EBD Recanto Elimar · Atualização de Dados</div>

  <hr class="divider">

  <div class="field">
    <label>Senha de acesso</label>
    <input type="password" id="senha" placeholder="••••" autocomplete="off" />
  </div>

  <div class="field">
    <label>Planilha (.xlsx)</label>
    <input type="file" id="arquivo" accept=".xlsx,.xls" />
    <div class="file-info">A planilha atual será substituída pela nova.</div>
  </div>

  <button class="btn" id="btnEnviar" onclick="enviar()">ENVIAR E ATUALIZAR DASHBOARD</button>

  <div class="msg" id="msg"></div>

  <hr class="divider">
  <a href="/" class="back-link">← Voltar ao Dashboard</a>
</div>

<script>
async function enviar() {
  const senha = document.getElementById('senha').value.trim();
  const arquivo = document.getElementById('arquivo').files[0];
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnEnviar');

  msg.className = 'msg';
  msg.textContent = '';

  if (!senha) { showMsg('err', 'Informe a senha de acesso.'); return; }
  if (!arquivo) { showMsg('err', 'Selecione a planilha antes de enviar.'); return; }
  if (!arquivo.name.match(/\.(xlsx|xls)$/i)) { showMsg('err', 'O arquivo deve ser .xlsx ou .xls'); return; }

  btn.disabled = true;
  showMsg('loading', 'Enviando e processando planilha… aguarde.');

  const form = new FormData();
  form.append('senha', senha);
  form.append('planilha', arquivo);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const json = await res.json();

    if (res.ok && json.ok) {
      showMsg('ok', '✦ Planilha processada com sucesso! O dashboard foi atualizado.');
      document.getElementById('arquivo').value = '';
    } else {
      showMsg('err', 'Erro: ' + (json.error || 'Resposta inesperada do servidor.'));
    }
  } catch (e) {
    showMsg('err', 'Falha na conexão: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

function showMsg(type, text) {
  const msg = document.getElementById('msg');
  msg.className = 'msg ' + type;
  msg.textContent = text;
}

document.getElementById('senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') enviar();
});
</script>
</body>
</html>
